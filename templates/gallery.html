{% extends "base.html" %}

{% block title %}Gallery - AI Reel Generator{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
{% endblock %}

{% block content %}
<h1 class="gallery-title">Reel Gallery</h1>
<div class="container gallery-container relative">

        <div class="gallery-item absolute">
            <div class="reel-card">
                <div class="reel-thumbnail">
                   {% for img in images %}
                        <img src="{{ url_for('static', filename='projectimages/' ~ img) }}" alt="Random Image" class="showcase-image">
                    {% endfor %}
                    <div class="play-overlay">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
                <div class="reel-info">
                    <h3>Summer Vibes</h3>
                    <p>Created by: User123</p>
                </div>
            </div>
        </div>
        <!-- <div class="gallery-item absolute">
            <div class="reel-card">
                <div class="reel-thumbnail">
                    <img src="{{ url_for('static', filename='2.jpg') }}" alt="Reel thumbnail">
                    <div class="play-overlay">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
                <div class="reel-info">
                    <h3>City Lights</h3>
                    <p>Created by: Creator456</p>
                </div>
            </div>
        </div> -->

        <div class="gallery-item-video ">
        {% for reel in reels %}
            <video src="/static/reels/{{reel}}" controls class="reelvideo"></video>
            <i class="fas fa-play"></i>
        {% endfor%}
        </div>
    </div>
</div>
{% endblock %}
